<!DOCTYPE html>
<html>
<head>
    <title>Chat Widget Example</title>
    <!-- Add React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Remove the CSS link since styles will be loaded into Shadow DOM -->
    <!-- <link rel="stylesheet" href="data/openai-chat-widget.css"> -->
    <script src="data/chat-widget.umd.js"></script>
    
    <!-- Add some conflicting styles to demonstrate Shadow DOM isolation -->
    <style>
        /* This should NOT affect the chat widget */
        .chat-window {
            background-color: red !important;
            font-family: 'Comic Sans MS', cursive !important;
        }
        
        .chat-message {
            border: 5px solid lime !important;
        }
    </style>
</head>
<body>
    <div id="chat-widget"></div>
    <script>
        // Initialize the chat widget
        const { mountChatWidget } = SiteChimeWidget;
        // Example: mount using the APEXA test config and pass example
        // X-LTAI-EXT headers that will be forwarded to the agent layer.
        mountChatWidget('chat-widget', {
            apiKey: '',
            configUrl: 'data/widget-config.apexa.json',
            position: 'bottom-right',
            theme: {
                primary: '#0b5fff',
                secondary: '#ffffff',
                text: '#000000',
                surface: '#ffffff',
                border: '#e5e7eb'
            },
            externalHeaders: {
                'X-LTAI-EXT-APEXAIQ-API-TOKEN': 'test-apexa-token',
                'X-LTAI-EXT-CLIENT-ID': 'apexa-test-tenant',
                'X-LTAI-EXT-SESSION-CONTEXT': '{"session":"test-session"}'
            }
        });
    </script>
</body>
</html>
